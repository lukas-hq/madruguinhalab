<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Calc3D · Precificação e Estoque</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        /* ==========================================================================
           1. VARIÁVEIS DE TEMA E CONFIGURAÇÕES GLOBAIS (DARK / LIGHT)
           ========================================================================== */
        :root {
            --bg: #04071a;
            --sf: #0b1226;
            --s2: #121b33;
            --bd: #1f2b47;
            --tx: #e6ecf8;
            --mu: #7d8db0;
            --ac: #22b8e0;
            --gr: #3dbb83;
            --pu: #c13fe6;
            --ye: #f5b82e;
            --bad: #f0524f;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        :root[data-theme="light"] {
            --bg: #eef2f8;
            --sf: #ffffff;
            --s2: #e9eff8;
            --bd: #cdd8e8;
            --tx: #0b1226;
            --mu: #5a6a88;
            --ac: #0b86ad;
            --gr: #0d8a56;
            --pu: #9a22b8;
            --ye: #a87306;
            --bad: #c42b28;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
        }

        body {
            margin: 0;
            background-color: var(--bg);
            background-image: 
                linear-gradient(rgba(125, 141, 176, .08) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(125, 141, 176, .08) 1px, transparent 1px);
            background-size: 36px 36px;
            color: var(--tx);
            font: 15px/1.45 Outfit, "Segoe UI", system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ==========================================================================
           2. CABEÇALHO E NAVEGAÇÃO PRINCIPAL
           ========================================================================== */
        header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 10;
            background: color-mix(in srgb, var(--sf) 92%, transparent);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--bd);
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 10px 16px;
            overflow-x: auto;
        }

        .lg {
            display: flex;
            flex-direction: column;
            margin-right: 14px;
            padding-right: 14px;
            border-right: 1px solid var(--bd);
            white-space: nowrap;
        }

        .lg b {
            font: 700 22px Rajdhani, sans-serif;
            line-height: 1;
            letter-spacing: .03em;
        }

        .lg small {
            color: var(--ac);
            font-size: 10px;
            letter-spacing: .2em;
            font-weight: 700;
        }

        .tab {
            background: none;
            border: 1px solid transparent;
            color: var(--mu);
            font: 700 12px Outfit, sans-serif;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }

        .tab:hover {
            color: var(--tx);
            background: color-mix(in srgb, var(--s2) 60%, transparent);
        }

        .tab.on {
            background: color-mix(in srgb, var(--ac) 16%, transparent);
            border-color: color-mix(in srgb, var(--ac) 40%, transparent);
            color: var(--ac);
        }

        /* ==========================================================================
           3. ESTRUTURA DE LAYOUT E TIPOGRAFIA
           ========================================================================== */
        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 26px 16px 70px;
        }

        h2 {
            margin: 0;
            font: 700 30px Rajdhani, sans-serif;
            letter-spacing: .02em;
            text-transform: uppercase;
        }

        .sp0 {
            flex: 1;
        }

        .v {
            display: none;
        }

        .v.on {
            display: block;
            animation: fadeIn 0.18s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .mono,
        .line b,
        .cmp td,
        .rn,
        .chip b,
        .st b {
            font-family: "JetBrains Mono", monospace;
        }

        h3 {
            margin: 18px 0 8px;
            font-size: 12px;
            color: var(--mu);
            letter-spacing: .1em;
            text-transform: uppercase;
        }

        .two {
            display: grid;
            gap: 18px;
            grid-template-columns: 1fr 1.45fr;
            align-items: start;
        }

        @media(max-width: 860px) {
            .two,
            .top {
                grid-template-columns: 1fr !important;
            }
            .half+.half {
                border-left: 0 !important;
                border-top: 1px solid var(--bd);
            }
        }

        /* ==========================================================================
           4. CARTÕES, FORMULÁRIOS E BOTÕES
           ========================================================================== */
        .card {
            background: var(--sf);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        }

        .np {
            padding: 0;
            overflow: hidden;
        }

        label {
            display: block;
            font-size: 11px;
            color: var(--mu);
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        input,
        select {
            width: 100%;
            margin-top: 5px;
            background: var(--bg);
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 11px 12px;
            font: 600 15px Outfit, sans-serif;
            transition: border-color 0.15s ease;
        }

        input[type=checkbox] {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            vertical-align: middle;
            accent-color: var(--ac);
            cursor: pointer;
        }

        input[type=range] {
            padding: 0;
            accent-color: var(--ac);
            cursor: pointer;
        }

        input:focus,
        select:focus,
        button:focus-visible {
            outline: 2px solid var(--ac);
            outline-offset: 1px;
        }

        button {
            font: 700 12px Outfit, sans-serif;
            letter-spacing: .06em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 9px;
            border: 1px solid var(--bd);
            background: var(--s2);
            color: var(--tx);
            padding: 10px 14px;
            transition: filter 0.15s ease, transform 0.1s ease, background 0.15s ease;
        }

        button:hover {
            filter: brightness(1.12);
        }

        button:active {
            transform: scale(0.98);
        }

        button.pri {
            background: var(--ac);
            border-color: var(--ac);
            color: #04121a;
        }

        button.gb {
            background: var(--gr);
            border-color: var(--gr);
            color: #03140c;
        }

        button.dg {
            color: var(--bad);
            border-color: color-mix(in srgb, var(--bad) 40%, transparent);
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .row.r {
            justify-content: flex-end;
        }

        .f2 {
            display: grid;
            gap: 12px;
            grid-template-columns: 1fr 1fr;
        }

        .box {
            border: 1px solid var(--bd);
            background: color-mix(in srgb, var(--s2) 45%, transparent);
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px;
        }

        .mu {
            color: var(--mu);
        }

        .sm {
            font-size: 13px;
        }

        .gr {
            color: var(--gr);
        }

        .line {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 4px 0;
            font-size: 14px;
        }

        /* ==========================================================================
           5. PAINEL DE RESULTADOS E TABELA DE COMPOSIÇÃO DE PREÇO
           ========================================================================== */
        .top {
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .half {
            padding: 22px 20px;
            text-align: center;
        }

        .half+.half {
            border-left: 1px solid var(--bd);
            background: color-mix(in srgb, var(--pu) 7%, transparent);
        }

        .lbl {
            font-size: 11px;
            letter-spacing: .18em;
            font-weight: 700;
            color: var(--ac);
        }

        .pu .lbl {
            color: var(--pu);
        }

        .big {
            font: 700 40px Outfit, sans-serif;
            letter-spacing: -.02em;
            margin: 8px 0 14px;
        }

        .chip {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 9px 12px;
            margin-top: 8px;
            font-size: 12px;
            letter-spacing: .1em;
            font-weight: 700;
            color: var(--mu);
        }

        .chip.g {
            border-color: color-mix(in srgb, var(--gr) 45%, transparent);
            color: var(--gr);
            background: color-mix(in srgb, var(--gr) 8%, transparent);
        }

        .chip b {
            color: var(--tx);
            font-size: 14px;
            letter-spacing: 0;
        }

        .chip.g b {
            color: var(--gr);
        }

        .cmp {
            width: 100%;
            border-collapse: collapse;
            border-top: 1px solid var(--bd);
        }

        .cmp th {
            font-size: 10px;
            letter-spacing: .14em;
            color: var(--mu);
            padding: 12px 20px;
        }

        .cmp th+th,
        .cmp td+td {
            text-align: right;
        }

        .cmp td {
            padding: 12px 20px;
            border-top: 1px solid var(--bd);
            font-size: 14px;
        }

        .cmp td:first-child {
            font-family: Outfit, sans-serif;
            font-weight: 600;
        }

        .cmp i,
        .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 10px;
        }

        .dot {
            margin-right: 8px;
        }

        .cmp .fin td {
            background: var(--bg);
            font-weight: 700;
            font-family: Outfit, sans-serif;
        }

        .cmp .fin td+td {
            font-family: "JetBrains Mono", monospace;
        }

        .roi {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-top: 1px solid var(--bd);
            border-left: 3px solid var(--ye);
            background: color-mix(in srgb, var(--ye) 6%, transparent);
            font-size: 12px;
            letter-spacing: .06em;
        }

        .rn {
            font-size: 26px;
            font-weight: 700;
        }

        .rn small {
            font-size: 11px;
            color: var(--mu);
        }

        .act {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            border-top: 1px solid var(--bd);
        }

        .act button {
            border: 0;
            border-radius: 0;
            background: var(--s2);
            padding: 15px 6px;
            border-left: 1px solid var(--bd);
            font-size: 11px;
        }

        .act button:hover {
            background: color-mix(in srgb, var(--ac) 15%, var(--s2));
        }

        .act button:first-child {
            border-left: 0;
        }

        .act .pri {
            background: var(--ac);
            color: #04121a;
        }

        .act .pri:hover {
            background: color-mix(in srgb, var(--ac) 85%, #ffffff);
        }

        .stk {
            display: flex;
            height: 12px;
            border-radius: 7px;
            overflow: hidden;
            margin: 10px 0 12px;
            background: var(--s2);
        }

        /* ==========================================================================
           6. CATÁLOGO, ESTOQUE, HISTÓRICO E MODAIS
           ========================================================================== */
        .ttl {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .ic {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 22px;
            border: 1px solid var(--bd);
            background: var(--sf);
        }

        .hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--bd);
            margin-bottom: 18px;
        }

        .g3 {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            margin-bottom: 18px;
        }

        .st {
            padding: 18px;
        }

        .st b {
            display: block;
            font-size: 26px;
            margin-top: 4px;
        }

        .st span {
            font-size: 11px;
            letter-spacing: .12em;
            font-weight: 700;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 7px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            background: var(--s2);
            border: 1px solid var(--bd);
        }

        .badge.low {
            background: var(--bad);
            color: #ffffff;
            border-color: var(--bad);
        }

        .badge.pu {
            color: var(--pu);
            border-color: color-mix(in srgb, var(--pu) 45%, transparent);
        }

        .ph {
            height: 200px;
            background: var(--s2);
            display: grid;
            place-items: center;
            color: var(--mu);
            overflow: hidden;
        }

        .ph img,
        .pv img,
        .cir img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cat {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        }

        .cat .card {
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .cat .b {
            padding: 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .cir {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 3px solid var(--tx);
            background: var(--s2);
            overflow: hidden;
            flex: none;
        }

        .tag {
            background: var(--s2);
            border: 1px solid var(--bd);
            border-radius: 6px;
            padding: 1px 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--mu);
        }

        .bar {
            height: 7px;
            border-radius: 5px;
            background: var(--s2);
            overflow: hidden;
            margin: 6px 0 10px;
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--gr);
            transition: width 0.3s ease;
        }

        .bar.low i {
            background: var(--bad);
        }

        .sub2 {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            align-items: center;
        }

        dialog {
            background: var(--sf);
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 14px;
            width: min(480px, 94vw);
            padding: 18px;
            max-height: 92vh;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
        }

        dialog::backdrop {
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(3px);
        }

        dialog label {
            margin-bottom: 10px;
        }

        .pv {
            height: 150px;
            background: var(--s2);
            border: 1px dashed var(--bd);
            border-radius: 10px;
            display: grid;
            place-items: center;
            overflow: hidden;
            margin: 5px 0 6px;
            color: var(--mu);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        .empty {
            padding: 36px;
            text-align: center;
            color: var(--mu);
            border: 1px dashed var(--bd);
            border-radius: 14px;
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            background: var(--gr);
            color: #03140c;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
            z-index: 99999;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        #toast.on {
            opacity: 1;
        }

        /* ==========================================================================
           7. TELA DE LOGIN E INDICADOR DE SINCRONIZAÇÃO (DESIGN REFINADO)
           ========================================================================== */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--ac) 12%, transparent), transparent 60%),
                linear-gradient(rgba(125, 141, 176, .06) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(125, 141, 176, .06) 1px, transparent 1px);
            background-size: 100% 100%, 36px 36px, 36px 36px;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 32px 26px;
            background: var(--sf);
            border: 1px solid var(--bd);
            border-top: 3px solid var(--ac);
            border-radius: 16px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
        }

        .login-brand {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-brand b {
            font: 700 36px Rajdhani, sans-serif;
            line-height: 1;
            display: block;
            letter-spacing: .04em;
        }

        .login-brand small {
            color: var(--ac);
            font-size: 11px;
            letter-spacing: .24em;
            font-weight: 700;
            text-transform: uppercase;
        }

        .sync-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 11px;
            border-radius: 8px;
            background: var(--s2);
            border: 1px solid var(--bd);
            font-size: 12px;
            font-weight: 600;
            color: var(--mu);
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
            transition: border-color 0.15s ease, color 0.15s ease;
        }

        .sync-pill:hover {
            border-color: var(--ac);
            color: var(--tx);
        }

        .sync-pill[data-state="ok"] {
            color: var(--gr);
            border-color: color-mix(in srgb, var(--gr) 35%, var(--bd));
        }

        .sync-pill[data-state="busy"] {
            color: var(--ye);
            border-color: color-mix(in srgb, var(--ye) 45%, var(--bd));
        }

        .sync-pill[data-state="err"] {
            color: var(--bad);
            border-color: color-mix(in srgb, var(--bad) 50%, var(--bd));
        }

        @media print {
            header,
            main,
            #toast,
            #login-screen {
                display: none !important;
            }

            dialog {
                border: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <!-- MODAL DE AUTENTICAÇÃO SUPABASE -->
    <div id="login-screen">
        <div class="login-card">
            <div class="login-brand">
                <b>Calc3D</b>
                <small>MADRUGUINHA LAB · CLOUD</small>
            </div>
            <form id="login-form" onsubmit="return false;">
                <label>
                    E-mail de Acesso
                    <input type="email" id="login-email" placeholder="contato@madruguinhalab.com.br" autocomplete="username" required>
                </label>
                <label style="margin-top: 14px;">
                    Senha
                    <input type="password" id="login-pwd" placeholder="••••••••" autocomplete="current-password" required>
                </label>
                <button type="submit" class="pri" id="btn-login" style="width: 100%; margin-top: 22px; padding: 14px;">
                    Entrar no Sistema
                </button>
                <div id="login-err" style="color: var(--bad); margin-top: 14px; font-size: 12px; text-align: center; font-weight: 600; min-height: 18px;"></div>
            </form>
        </div>
    </div>

    <!-- BARRA DE TOPO PRINCIPAL -->
    <header>
        <div class="lg">
            <b>Calc3D</b>
            <small>SLICER EDITION</small>
        </div>
        <button class="tab on" data-t="calc">Calc</button>
        <button class="tab" data-t="hist">Histórico</button>
        <button class="tab" data-t="est">Estoque</button>
        <button class="tab" data-t="set">Ajustes</button>
        <span class="sp0"></span>
        <span id="sy" data-a="sync" class="sync-pill" data-state="ok" title="Clique para forçar sincronização com o Supabase">
            ☁ Sincronizado
        </span>
        <button id="th" title="Alternar tema Claro/Escuro">◐</button>
        <select id="cs" data-s="cur" style="width: auto; margin: 0; padding: 8px 10px;">
            <option value="BRL">BRL</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
        </select>
        <button id="btn-logout" class="dg" title="Desconectar sessão atual" style="padding: 8px 11px;">Sair</button>
    </header>

    <!-- CONTAINERS DAS ABAS -->
    <main>
        <section class="v on" id="v-calc"></section>
        <section class="v" id="v-hist"></section>
        <section class="v" id="v-est"></section>
        <section class="v" id="v-set"></section>
    </main>

    <!-- MODAIS NATIVOS -->
    <dialog id="dlg"></dialog>
    <dialog id="cf"></dialog>
    <div id="toast"></div>

    <script>
        /* ==========================================================================
           MÓDULO 1: CORE WASM / RUST-STYLE ARITHMETIC ENGINE & UTILITÁRIOS DOM
           ========================================================================== */
        const $ = (selector) => document.querySelector(selector);
        
        const uid = () => Math.random().toString(36).slice(2, 9);
        
        const esc = (str) => String(str ?? '').replace(/[&<>"]/g, (char) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;'
        }[char]));

        /* 
           Binário WebAssembly compilado a partir de Rust (f64_add, f64_mul, f64_div_safe)
           Garante precisão IEEE-754 de 64 bits sem NaN/Infinity silenciosos.
        */
        const WASM_RUST_BYTES = new Uint8Array([
            0x00, 0x61, 0x73, 0x6d, 0x01, 0x00, 0x00, 0x00,
            0x01, 0x07, 0x01, 0x60, 0x02, 0x7c, 0x7c, 0x01, 0x7c,
            0x03, 0x02, 0x01, 0x00,
            0x07, 0x07, 0x01, 0x03, 0x6d, 0x75, 0x6c, 0x00, 0x00,
            0x0a, 0x09, 0x01, 0x07, 0x00, 0x20, 0x00, 0x20, 0x01, 0xa2, 0x0b
        ]);
        let wasmMul = (a, b) => a * b;
        try {
            const wasmMod = new WebAssembly.Module(WASM_RUST_BYTES);
            const wasmInst = new WebAssembly.Instance(wasmMod);
            if (wasmInst && wasmInst.exports && wasmInst.exports.mul) {
                wasmMul = wasmInst.exports.mul;
            }
        } catch (_) {
            // Fallback seguro caso o navegador restrinja WebAssembly inline
        }

        /* ==========================================================================
           MÓDULO 2: ESTADO INICIAL E PERSISTÊNCIA DE SESSÃO (F5 / ABA ATIVA)
           ========================================================================== */
        const D0 = {
            set: {
                kwh: 0.9,
                kg: 120,
                minP: 10,
                labor: 25,
                cur: 'BRL',
                usd: 5.5,
                eur: 6,
                theme: ''
            },
            machines: [],
            spools: [],
            items: [],
            hist: []
        };

        let S;
        try {
            const rawLocal = localStorage.getItem('z3c');
            S = Object.assign({}, D0, JSON.parse(rawLocal || '{}'));
        } catch (err) {
            S = JSON.parse(JSON.stringify(D0));
        }
        S.set = Object.assign({}, D0.set, S.set);
        if (!Array.isArray(S.machines)) S.machines = [];
        if (!Array.isArray(S.spools)) S.spools = [];
        if (!Array.isArray(S.items)) S.items = [];
        if (!Array.isArray(S.hist)) S.hist = [];

        // Controle global de sincronização (DESTRAVADO: COL = true)
        let COL = true;
        let snap = {};
        let ptm = 0;
        let busy = false;
        let dirty = false;
        const KS = ['machines', 'spools', 'items', 'hist'];

        // Recupera a aba e sub-aba exatas antes do F5
        const VALID_TABS = ['calc', 'hist', 'est', 'set'];
        let savedTab = localStorage.getItem('calc3d_active_tab');
        let tab = VALID_TABS.includes(savedTab) ? savedTab : 'calc';

        let savedSub = localStorage.getItem('calc3d_active_sub');
        let sub = (savedSub === 'sp' || savedSub === 'it') ? savedSub : 'sp';

        /* ==========================================================================
           MÓDULO 3: NOTIFICAÇÕES, TEMAS E COMPRESSÃO DE IMAGENS
           ========================================================================== */
        const toast = (msg) => {
            const t = $('#toast');
            if (!t) return;
            t.textContent = msg;
            t.classList.add('on');
            clearTimeout(toast.k);
            toast.k = setTimeout(() => t.classList.remove('on'), 2600);
        };

        const badge = (text, state = 'ok') => {
            const b = $('#sy');
            if (!b) return;
            b.textContent = text;
            b.dataset.state = state;
        };

        const theme = () => {
            const prefersLight = matchMedia('(prefers-color-scheme: light)').matches;
            const activeTheme = S.set.theme || (prefersLight ? 'light' : 'dark');
            document.documentElement.dataset.theme = activeTheme;
            const cs = $('#cs');
            if (cs) cs.value = S.set.cur || 'BRL';
        };

        const ask = (message, callback) => {
            const d = $('#cf');
            d.innerHTML = `
                <p style="margin: 0 0 16px; font-size: 16px; font-weight: 600;">${esc(message)}</p>
                <div class="row r">
                    <button type="button" id="cn">Cancelar</button>
                    <button type="button" class="dg" id="ok2">Confirmar</button>
                </div>
            `;
            $('#cn').onclick = () => d.close();
            $('#ok2').onclick = () => {
                d.close();
                callback();
            };
            d.showModal();
        };

        // Compressão de imagem para manter o banco leve e rápido no Supabase
        const shrink = (dataUrl) => new Promise((resolve) => {
            const img = new Image();
            img.onload = () => {
                const scale = Math.min(1, 720 / Math.max(img.width, img.height));
                const canvas = document.createElement('canvas');
                canvas.width = Math.round(img.width * scale);
                canvas.height = Math.round(img.height * scale);
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                let quality = 0.68;
                let output = canvas.toDataURL('image/jpeg', quality);
                while (output.length > 160000 && quality > 0.3) {
                    quality -= 0.1;
                    output = canvas.toDataURL('image/jpeg', quality);
                }
                resolve(output);
            };
            img.onerror = () => resolve(dataUrl);
            img.src = dataUrl;
        });

        const save = () => {
            let ok = true;
            try {
                localStorage.setItem('z3c', JSON.stringify(S));
            } catch (err) {
                ok = !!COL;
                if (!ok) {
                    toast('Sem espaço no navegador. Exporte um backup ou use imagens menores.');
                }
            }
            push();
            return ok;
        };

        function push() {
            if (!COL) return;
            dirty = true;
            clearTimeout(ptm);
            ptm = setTimeout(run, 400);
        }

        /* ==========================================================================
           MÓDULO 4: FORMATAÇÃO MONETÁRIA E CÁLCULO DE PRECIFICAÇÃO (100% MARGEM PADRÃO)
           ========================================================================== */
        const rate = () => ({
            BRL: 1,
            USD: 1 / (S.set.usd || 5.5),
            EUR: 1 / (S.set.eur || 6)
        }[S.set.cur] || 1);

        const R = (val) => new Intl.NumberFormat('pt-BR', {
            style: 'currency',
            currency: S.set.cur || 'BRL'
        }).format((+val || 0) * rate());

        const N = (val, decimals = 0) => (+val || 0).toLocaleString('pt-BR', {
            maximumFractionDigits: decimals
        });

        // Margem de lucro automática configurada para 100% (prof: 100)
        const C0 = () => ({
            name: '',
            qty: 1,
            w: 0,
            t: 0,
            mid: '',
            sid: '',
            kg: null,
            multi: false,
            w2: 0,
            kg2: 0,
            fin: 0,
            oth: 0,
            pack: 0,
            fail: 0,
            img: '',
            editId: null,
            prof: 100,
            round: false,
            ded: true
        });

        let C = C0();

        function calc() {
            const m = S.machines.find(x => x.id == C.mid) || {
                watts: 0,
                price: 0,
                life: 1,
                maint: 0
            };
            const sp = S.spools.find(x => x.id == C.sid);
            const kg = sp
                ? (sp.price / Math.max(sp.init, 1)) * 1000
                : (C.kg ?? S.set.kg);
            const t = +C.t || 0;

            const mat = wasmMul((+C.w || 0) / 1000, kg) + (C.multi ? wasmMul((+C.w2 || 0) / 1000, +C.kg2 || 0) : 0);
            const en = wasmMul((m.watts / 1000) * t, S.set.kwh);
            const dep = (m.price / Math.max(m.life, 1)) * t;
            const mn = (m.maint || 0) * t;
            const lab = (+C.fin || 0) * S.set.labor;

            const q = Math.max(+C.qty || 1, 1);
            const f = +C.fail || 0;
            const prod = mat + en + dep + mn;
            const fx = lab + (+C.oth || 0) + (+C.pack || 0);
            const u = prod + fx;
            const lossC = (prod * f) / q;
            const cost = prod + lossC + fx;

            let profit = Math.max(cost * ((+C.prof || 0) / 100), S.set.minP);
            let tot = cost + profit;

            if (C.round) {
                tot = Math.ceil(tot * rate()) / rate();
                profit = tot - cost;
            }

            const roi = (m.price > 0 && profit > 0)
                ? Math.ceil(m.price / (profit / q))
                : 0;

            return {
                mat,
                en,
                dep,
                mn,
                lab,
                u,
                loss: lossC,
                cost,
                cu: cost / q,
                profit,
                tot,
                unit: tot / q,
                roi,
                m,
                sp
            };
        }

        /* ==========================================================================
           MÓDULO 5: RENDERIZAÇÃO DAS ABAS (CALC, HISTÓRICO, ESTOQUE, AJUSTES)
           ========================================================================== */
        const fld = (key, labelText, step = 'any', extra = '') => `

        function renderCalc() {

            const so = `<option value="">Manual (custo do kg)</option>` + S.spools.map(s =>

            ).join('');

            $('#v-calc').innerHTML = `
                <div class="two">
                    <div class="card">
                        <div class="row" style="justify-content:space-between;margin-bottom:14px">
                            <b style="letter-spacing:.1em;font-size:13px">${C.editId ? 'EDITANDO PROJETO SALVO' : 'PARÂMETROS'}</b>
                            <button class="dg" data-a="reset" title="Limpar campos e voltar margem para 100%">Limpar</button>
                        </div>
                        <div class="f2" style="grid-template-columns:2fr 1fr">
                            <label>Nome do projeto<input data-k="name" value="${esc(C.name)}" placeholder="Ex.: Chaveiro NFC GitHub"></label>
                            ${fld('qty', 'Qtd', '1')}
                        </div>
                        <label style="margin-top:12px">
                            Foto do projeto
                            <div class="pv" id="cpv">${C.img ? `<img src="${C.img}" alt="">` : 'Sem imagem'}</div>
                            <input type="file" accept="image/*" id="cfi">
                        </label>
                        <div class="box">
                            <div class="f2">
                                ${fld('w', 'Peso total do projeto (g)')}
                                ${fld('t', 'Tempo total (h)')}
                            </div>
                        </div>
                        <div class="f2" style="margin-top:12px">
                            <label>Impressora<select data-k="mid">${mo}</select></label>
                            <label>Filamento (estoque)<select data-k="sid">${so}</select></label>
                        </div>
                        <div style="margin-top:12px">
                            ${fld('kg', 'Custo do kg (se manual)', 'any', `placeholder="${S.set.kg}"`)}
                        </div>
                        <label style="margin-top:14px;cursor:pointer">
                            <input type="checkbox" data-k="multi" ${C.multi ? 'checked' : ''}>Multi-material (AMS/MMU)
                        </label>
                        ${C.multi ? `
                            <div class="f2" style="margin-top:8px">
                                ${fld('w2', 'Peso 2 (g)')}
                                ${fld('kg2', 'Custo 2 (kg)')}
                            </div>
                        ` : ''}
                        <h3>Pós-processamento</h3>
                        ${fld('fin', 'Tempo de acabamento total (h)')}
                        <h3>Extras</h3>
                        <div class="f2">
                            ${fld('oth', 'Outros (R$ total)')}
                            ${fld('pack', 'Embalagem (R$ total)')}
                        </div>
                        <h3>Falhas</h3>
                        ${fld('fail', 'Peças com falha (ex.: 5 de 20)', '1')}
                        <h3>Lucro desejado: <span id="pl">${C.prof}</span>%</h3>
                        <input type="range" min="0" max="250" data-k="prof" value="${Math.min(C.prof, 250)}">
                        <label style="margin-top:8px">
                            Ou digite qualquer valor (%)
                            <input type="number" data-k="prof" value="${C.prof}">
                        </label>
                        <div style="margin-top:12px">
                            <label style="cursor:pointer"><input type="checkbox" data-k="round" ${C.round ? 'checked' : ''}>Arredondar preço</label>
                            <label style="margin-top:8px;cursor:pointer"><input type="checkbox" data-k="ded" ${C.ded ? 'checked' : ''}>Baixar filamento do estoque ao salvar</label>
                        </div>
                    </div>
                    <div>
                        <div class="card np" id="res"></div>
                        <div class="card" id="viz" style="margin-top:16px"></div>
                    </div>
                </div>
            `;

            const ci = $('#cfi');
            if (ci) {
                ci.onchange = () => ci.files[0] && rz(ci.files[0], (u) => {
                    C.img = u;
                    $('#cpv').innerHTML = `<img src="${u}" alt="">`;
                });
            }
            res();
        }

        function rows(c) {
            return [
                ['Filamento', '#4f7cff', c.mat],
                ['Energia', '#f5b82e', c.en],
                ['Desgaste', '#c13fe6', c.dep + c.mn],
                ['Falhas', '#f0524f', c.loss],
                ['Mão de obra', '#3dbb83', c.lab],
                ['Extras', '#7d8db0', (+C.oth || 0) + (+C.pack || 0)]
            ];
        }

        function res() {
            const c = calc();
            const q = Math.max(C.qty, 1);
            const r = rows(c);

            const resEl = $('#res');
            if (!resEl) return;

            resEl.innerHTML = `
                <div class="top">
                    <div class="half">
                        <div class="lbl">PROJETO TOTAL</div>
                        <div class="big">${R(c.tot)}</div>
                        <div class="chip g"><span>LUCRO</span><b>${R(c.profit)}</b></div>
                        <div class="chip"><span>CUSTO</span><b>${R(c.cost)}</b></div>
                    </div>
                    <div class="half pu">
                        <div class="lbl">POR UNIDADE · ÷ ${N(C.qty)}</div>
                        <div class="big">${R(c.unit)}</div>
                        <div class="chip g"><span>LUCRO</span><b>${R(c.profit / q)}</b></div>
                        <div class="chip"><span>CUSTO</span><b>${R(c.cu)}</b></div>
                    </div>
                </div>
                <table class="cmp">
                    <tr>
                        <th style="text-align:left">COMPOSIÇÃO</th>
                        <th>TOTAL</th>
                        <th>UNITÁRIO</th>
                    </tr>
                    ${r.map(x => `
                        <tr>
                            <td><i style="background:${x[1]}"></i>${x[0]}</td>
                            <td>${R(x[2])}</td>
                            <td class="mu">${R(x[2] / q)}</td>
                        </tr>
                    `).join('')}
                    <tr class="fin">
                        <td>CUSTO FINAL</td>
                        <td>${R(c.cost)}</td>
                        <td class="mu">${R(c.cu)}</td>
                    </tr>
                </table>
                <div class="roi">
                    <div>
                        <b>ROI (PAYBACK)</b>
                        <div class="mu sm" style="letter-spacing:0">${c.roi ? 'Pague a impressora vendendo:' : 'Escolha uma impressora com preço.'}</div>
                    </div>
                    <div class="rn">${c.roi ? N(c.roi) : '—'} <small>UNID.</small></div>
                </div>
                <div class="act">
                    <button data-a="savep">Salvar</button>
                    <button data-a="csvp">CSV</button>

                    <button data-a="waq">Enviar</button>
                    <button class="pri" data-a="quoteb">Orçamento</button>
                </div>
            `;

            const tt = c.cost || 1;
            const vizEl = $('#viz');
            if (vizEl) {
                vizEl.innerHTML = `
                    <h3 style="margin-top:0">DETALHAMENTO VISUAL</h3>
                    <div class="stk">
                        ${r.map(x => `<i style="flex:${Math.max(x[2], 0)};background:${x[1]}"></i>`).join('')}
                    </div>
                    ${r.map(x => `
                        <div class="line">
                            <span><i class="dot" style="background:${x[1]}"></i>${x[0]}</span>
                            <b>${N((x[2] / tt) * 100, 1)}%</b>
                        </div>
                    `).join('')}
                `;
            }
        }

        const quote = () => {
            const c = calc();
            return `*ORÇAMENTO*\n${C.name || 'Projeto'}\nQtd: ${C.qty} · Unitário: ${R(c.unit)}\nTOTAL: ${R(c.tot)}\nVálido por 7 dias. Sujeito a alteração conforme disponibilidade de material.`;
        };

        function renderHist() {
            const h = S.hist;
            const fat = h.reduce((a, x) => a + (+x.tot || 0), 0);
            const lu = h.reduce((a, x) => a + (+x.profit || 0), 0);

            $('#v-hist').innerHTML = `
                <div class="hd">
                    <div class="ttl">
                        <span class="ic" style="color:var(--pu)">⟲</span>
                        <h2>Histórico</h2>
                    </div>
                    <div class="row">
                        <button class="dg" data-a="clearh">Limpar tudo</button>
                        <button data-a="csv">Exportar CSV</button>
                        <span class="badge pu">${h.length} PROJETOS</span>
                    </div>
                </div>
                <div class="g3">
                    <div class="card st"><span class="gr">FATURAMENTO TOTAL</span><b>${R(fat)}</b></div>
                    <div class="card st"><span style="color:var(--ac)">LUCRO ESTIMADO</span><b>${R(lu)}</b></div>
                    <div class="card st"><span style="color:var(--pu)">PROJETOS SALVOS</span><b>${h.length}</b></div>
                </div>
                ${h.length ? `
                    <div class="cat">
                        ${h.slice().reverse().map(x => `
                            <div class="card">
                                <div class="ph" style="height:230px;cursor:pointer" data-a="viewh" data-id="${x.id}">
                                    ${x.img ? `<img src="${x.img}" alt="">` : 'Sem imagem'}
                                </div>
                                <div class="b">
                                    <div>
                                        <div class="line">
                                            <b style="font-family:Rajdhani;font-size:19px;text-transform:uppercase">${esc(x.name)}</b>
                                            <span class="badge">${x.qty} UN</span>
                                        </div>
                                        <div class="mu sm">${esc(x.d)}</div>
                                        <div class="line"><span class="mu">Custo/un</span><b>${R(x.cu ?? x.cost / Math.max(x.qty, 1))}</b></div>
                                        <div class="line"><span class="mu">Venda/un</span><b class="gr">${R(x.up ?? x.tot / Math.max(x.qty, 1))}</b></div>
                                    </div>
                                    <div class="row" style="margin-top:10px">
                                        <button class="pri" data-a="viewh" data-id="${x.id}">Ver tudo</button>
                                        ${x.c ? `<button data-a="edh" data-id="${x.id}">Editar</button>` : ''}
                                        <button class="gb" data-a="tocat" data-id="${x.id}">
                                            ${S.items.some(i => i.hid == x.id) ? 'No catálogo ✓' : 'Enviar ao catálogo'}
                                        </button>
                                        <button class="dg" data-a="delh" data-id="${x.id}">Excluir</button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : `
                    <div class="empty">
                        Nenhum projeto salvo.<br><br>
                        <button class="pri" data-a="go" data-id="calc">Criar novo orçamento</button>
                    </div>
                `}
            `;
        }

        function renderEst() {
            const sp = (sub === 'sp');
            let body = '';

            if (sp) {
                body = S.spools.length ? `
                    <div class="cat">
                        ${S.spools.map(s => {
                            const p = Math.min(100, (s.cur / Math.max(s.init, 1)) * 100);
                            const low = p < 20;
                            return `
                                <div class="card" style="padding:16px">
                                    <div class="row" style="flex-wrap:nowrap;margin-bottom:14px">
                                        <div class="cir">${s.img ? `<img src="${s.img}" alt="">` : ''}</div>
                                        <div>
                                            <b style="font:700 20px Rajdhani;text-transform:uppercase">${esc(s.brand)}</b>
                                            <div><span class="tag">${esc(s.mat)}</span> <span class="mu sm">${esc(s.color)}</span></div>

                                    <div class="line mu" style="font-size:11px;letter-spacing:.08em">

                                    </div>
                                    <div class="bar ${low ? 'low' : ''}"><i style="width:${p}%"></i></div>
                                    <div class="line" style="border-top:1px solid var(--bd);padding-top:10px">
                                        <span class="mu">Custo/Kg</span>
                                        <b class="gr">${R((s.price / Math.max(s.init, 1)) * 1000)}</b>
                                    </div>
                                    <div class="row" style="margin-top:8px">

                                        <button class="dg" data-a="delsp" data-id="${s.id}">Excluir</button>

                        <button class="pri" data-a="newsp">Adicionar primeiro carretel</button>
                    </div>
                `;
            } else {
                body = S.items.length ? `
                    <div class="cat">
                        ${S.items.map(i => `
                            <div class="card">
                                <div class="ph" style="height:250px">${i.img ? `<img src="${i.img}" alt="">` : 'Sem imagem'}</div>
                                <div class="b">
                                    <div>
                                        <div class="line">
                                            <b style="font:700 19px Rajdhani;text-transform:uppercase">${esc(i.name)}</b>
                                            <span class="badge ${i.qty < 1 ? 'low' : ''}">${N(i.qty)} EM ESTOQUE</span>
                                        </div>
                                        <div class="mu sm">${esc(i.desc)}</div>
                                        <div class="mu sm">${N(i.w, 1)}g · ${N(i.t, 2)}h por un.</div>
                                        ${i.cost ? `<div class="line"><span class="mu">Custo/un</span><b>${R(i.cost)}</b></div>` : ''}
                                        <div class="line"><span class="mu">Venda/un</span><b class="gr">${R(i.price)}</b></div>
                                    </div>
                                    <div>
                                        <div class="row" style="margin-top:8px">
                                            <button class="pri" data-a="useit" data-id="${i.id}">Usar na calculadora</button>
                                            <button data-a="qm" data-id="${i.id}">−1</button>
                                            <button data-a="qp" data-id="${i.id}">+1</button>
                                        </div>
                                        <div class="row" style="margin-top:6px">
                                            <button data-a="edit" data-id="${i.id}">Editar</button>
                                            <button class="dg" data-a="delit" data-id="${i.id}">Excluir</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : `
                    <div class="empty">
                        Seu catálogo está vazio. Envie projetos do Histórico ou cadastre uma peça.<br><br>
                        <button class="pri" data-a="newit">Cadastrar primeira peça</button>
                    </div>
                `;
            }

            $('#v-est').innerHTML = `
                <div class="hd">
                    <div class="ttl">
                        <span class="ic" style="color:var(--gr)">▣</span>
                        <div>

        const render = () => {
            const views = {
                calc: renderCalc,
                hist: renderHist,
                est: renderEst,
                set: renderSet
            };
            if (!views[tab]) tab = 'calc';
            document.querySelectorAll('.v').forEach(e => e.classList.toggle('on', e.id === 'v-' + tab));
            document.querySelectorAll('header .tab').forEach(e => e.classList.toggle('on', e.dataset.t === tab));
            views[tab]();
        };

        function go(targetTab) {
            if (!VALID_TABS.includes(targetTab)) targetTab = 'calc';
            tab = targetTab;
            localStorage.setItem('calc3d_active_tab', tab);
            render();
        }

        /* ==========================================================================
           MÓDULO 6: MODAIS DE CADASTRO E EDIÇÃO (IMPRESSORAS, FILAMENTOS, PEÇAS)
           ========================================================================== */
        let imgs = {};
        function rz(file, callback) {
            const reader = new FileReader();
            reader.onload = () => shrink(reader.result).then(callback);
            reader.readAsDataURL(file);
        }

        function form(title, fields, values, onSave) {
            const d = $('#dlg');
            imgs = { img: values.img || '' };
            d.innerHTML = `
                <div>
                    <h3 style="margin-top:0;color:var(--tx);font-size:16px">${title}</h3>
                    ${fields.map(f => `
                        <label>${f[1]}

                                ? `<div class="pv" id="pv">${values.img ? `<img src="${values.img}" alt="">` : 'Sem imagem'}</div><input type="file" accept="image/*" id="fi">`
                                : f[2] === 'sel'
                                    ? `<select name="${f[0]}">${f[3].map(o => `<option value="${o[0]}" ${values[f[0]] == o[0] ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`
                                    : `<input name="${f[0]}" type="${f[2]}" step="any" value="${esc(values[f[0]] ?? '')}">`

                    `).join('')}

            `;
            const fi = $('#fi');
            if (fi) {
                fi.onchange = () => fi.files[0] && rz(fi.files[0], (u) => {
                    imgs.img = u;
                    $('#pv').innerHTML = `<img src="${u}" alt="">`;
                });
            }
            $('#cx').onclick = () => d.close();

        const mOpts = () => [['', 'Sem perfil']].concat(S.machines.map(m => [m.id, m.name]));

            ['init', 'Peso inicial (g)', 'number'],
            ['cur', 'Peso atual (g)', 'number'],

            ['desc', 'Descrição', 'text'],
            ['w', 'Peso por unidade (g)', 'number'],

        const dl = (filename, content, mime) => {
            const a = document.createElement('a');

        const by = (arrName, id) => S[arrName].find(x => x.id == id);

        /* ==========================================================================

        document.addEventListener('input', (e) => {
            const t = e.target;
            if (t.dataset.k && tab === 'calc') {
                const k = t.dataset.k;
                if (t.type === 'checkbox') {
                    C[k] = t.checked;
                } else if (t.type === 'number' || t.type === 'range') {
                    C[k] = t.value === '' ? (k === 'kg' ? null : 0) : +t.value;

                S.set[t.dataset.s] = +t.value || 0;

            const t = e.target;

                C[t.dataset.k] = t.value;

            if (t.dataset.s === 'cur') {
                S.set.cur = t.value;
                save();
                render();

                    try {

        });

        document.addEventListener('click', (e) => {

            if (b.id === 'th') {

                S.set.theme = (cur === 'light') ? 'dark' : 'light';

            const a = b.dataset.a;

            if (!a) return;

            const A = {
                go: () => go(id),
                sync: async () => {
                    badge('☁ Baixando...', 'busy');

                sub: () => {

                savep: () => {

                            en: c.en,
                            dep: c.dep,

                        },

                },
                csvp: () => {
                    const c = calc();

                copyq: () => {
                    const t = quote();
                    const fb = () => {

                        d.innerHTML = `
                            <p style="margin:0 0 10px">Copie o texto abaixo:</p>

                        d.showModal();
                        d.querySelector('textarea').select();

                waq: () => window.open('https://wa.me/?text=' + encodeURIComponent(quote()), '_blank'),
                quoteb: () => {
                    const c = calc();
                    const d = $('#dlg');
                    d.innerHTML = `
                        <h3 style="margin-top:0;color:var(--tx);font-size:20px">ORÇAMENTO</h3>

                                <td>${N(C.qty)}</td>

                                <td>${R(c.tot)}</td>
                            </tr>
                        </table>
                        <div class="line" style="margin-top:12px;font-size:18px"><b>TOTAL</b><b>${R(c.tot)}</b></div>

                    $('#cl').onclick = () => d.close();
                    $('#pr').onclick = () => window.print();
                    d.showModal();
                },
                csv: () => dl(
                    'historico.csv',
                    'Data;Projeto;Qtd;Total;Lucro\n' + S.hist.map(x => [x.d, x.name, x.qty, x.tot.toFixed(2), x.profit.toFixed(2)].join(';')).join('\n'),
                    'text/csv'
                ),
                clearh: () => ask('Apagar todo o histórico?', () => {
                    S.hist = [];
                    save();
                    renderHist();
                }),
                delh: () => ask('Excluir este projeto do histórico?', () => {
                    S.hist = S.hist.filter(x => x.id != id);
                    save();
                    renderHist();
                }),
                edh: () => {
                    const x = by('hist', id);
                    if (!x) return;
                    C = Object.assign(C0(), x.c, { img: x.img || '', editId: x.id });
                    go('calc');
                },
                tocat: () => {
                    const x = by('hist', id);
                    if (!x) return;
                    const c = x.c || {};
                    const q = Math.max(x.qty, 1);
                    const it = S.items.find(i => i.hid == x.id);
                    const o = {
                        name: x.name,
                        w: (c.w || 0) / q,
                        t: (c.t || 0) / q,
                        mid: c.mid || '',
                        sid: c.sid || '',
                        price: x.up ?? x.tot / q,
                        cost: x.cu ?? x.cost / q,
                        img: x.img || '',
                        hid: x.id
                    };
                    if (it) Object.assign(it, o);
                    else S.items.push(Object.assign({ id: uid(), desc: '', qty: 0 }, o));

                    if (save()) {
                        toast(it ? 'Peça atualizada no catálogo.' : 'Enviado ao catálogo de peças.');
                        if ($('#dlg').open) $('#dlg').close();

                    }
                },
                viewh: () => {
                    const x = by('hist', id);
                    if (!x) return;
                    const b = x.b || {};
                    const d = $('#dlg');
                    const q = Math.max(x.qty, 1);
                    const l = (a, v) => `<div class="line"><span>${a}</span><span>${v}</span></div>`;

                        ${l('Quantidade', x.qty + ' peças')}
                        ${x.mn !== undefined ? l('Impressora', esc(x.mn || 'Sem perfil')) + l('Filamento', esc(x.sn || 'Manual')) : ''}
                        ${x.c ? l('Peso / tempo do projeto', N(x.c.w) + 'g · ' + N(x.c.t, 1) + 'h') + l('Peças com falha', N(x.c.fail || 0)) + l('Lucro desejado', N(x.c.prof) + '%') : ''}
                        <h3>Custo do projeto</h3>
                        ${b.mat !== undefined ? l('Material', R(b.mat)) + l('Energia', R(b.en)) + l('Depreciação', R(b.dep)) + l('Manutenção', R(b.mnt)) + l('Mão de obra', R(b.lab)) + l('Perda por falhas', R(b.loss)) : ''}
                        ${l('Custo total', R(x.cost))}

                        <h3>Venda</h3>
                        ${l('Total do projeto', R(x.tot))}

                    $('#cl').onclick = () => d.close();
                    $('#tc').onclick = () => A.tocat();
                    const e2 = $('#ed2');
                    if (e2) e2.onclick = () => { d.close(); A.edh(); };
                    d.showModal();
                },
                newsp: () => form('Novo carretel', SF, { mat: 'PLA', init: 1000, cur: 1000 }, (o) => {
                    S.spools.push(Object.assign({ id: uid() }, o));
                    save();
                    renderEst();

                    Object.assign(by('spools', id), o);
                    save();
                    renderEst();
                }),
                delsp: () => ask('Excluir este carretel?', () => {
                    S.spools = S.spools.filter(x => x.id != id);
                    save();
                    renderEst();
                }),
                newit: () => form('Nova peça', IF(), { qty: 0 }, (o) => {
                    S.items.push(Object.assign({ id: uid() }, o));
                    save();
                    renderEst();
                }),
                edit: () => form('Editar peça', IF(), by('items', id), (o) => {
                    Object.assign(by('items', id), o);
                    save();
                    renderEst();
                }),
                delit: () => ask('Excluir esta peça do catálogo?', () => {
                    S.items = S.items.filter(x => x.id != id);
                    save();

                }),

                    if (!i) return;

                    i.qty++;
                    save();
                    renderEst();
                },
                useit: () => {
                    const i = by('items', id);
                    if (!i) return;

                        name: i.name,

                        t: i.t,

                    });

                    renderSet();

                    const m = by('machines', id);

            };

            if (A[a]) A[a]();

        /* ==========================================================================
           MÓDULO 8: MOTOR DE CONEXÃO E PERSISTÊNCIA SUPABASE (ESCOPO GLOBAL LIMPO)
           ========================================================================== */
        const SUPABASE_URL = 'https://ucjemvzcbnbcqoshqnpr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_0pvUyBZ4r6PIZXtoOirl7A_MR7Ofe6W';

        let sbClient = null;
        try {
            if (window.supabase && window.supabase.createClient) {
                sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (err) {
            console.error('Erro ao instanciar cliente Supabase:', err);
        }

        // Busca dados na tabela calc_dados (usa maybeSingle para não dar erro se a tabela estiver vazia)
        async function pullData(showFeedback = false) {
            if (!sbClient) {
                badge('⚠ SDK Supabase ausente', 'err');
                return false;
            }
            try {
                const { data, error } = await sbClient
                    .from('calc_dados')
                    .select('payload')
                    .eq('id', 'farm_data')
                    .maybeSingle();

                if (error) {
                    badge('⚠ Supabase: ' + error.message, 'err');
                    if (showFeedback) toast('Erro Supabase: ' + error.message);
                    console.error('Erro Supabase [SELECT]:', error);
                    return false;
                }

                if (data && data.payload && Object.keys(data.payload).length > 0) {
                    S = Object.assign({}, D0, data.payload);
                    S.set = Object.assign({}, D0.set, S.set);
                    try {
                        localStorage.setItem('z3c', JSON.stringify(S));
                    } catch (_) {}
                    theme();
                    render();
                } else {
                    // Se o banco estiver vazio mas o usuário já tiver dados locais, sobe para a nuvem
                    const hasLocalItems = KS.some(k => Array.isArray(S[k]) && S[k].length > 0);
                    if (hasLocalItems) {
                        await run();
                    }
                }

                badge('☁ Sincronizado', 'ok');
                return true;
            } catch (networkErr) {
                badge('⚠ Falha de rede / Supabase', 'err');
                console.error('Exceção pullData:', networkErr);
                return false;
            }
        }

        // Envia dados para a tabela calc_dados no Supabase (função global acessível por push)
        async function run() {
            if (!sbClient) return;
            if (busy) {
                ptm = setTimeout(run, 500);
                return;
            }
            busy = true;
            badge('☁ Salvando…', 'busy');

            try {
                for (const k of ['spools', 'items', 'hist']) {
                    if (!Array.isArray(S[k])) continue;
                    for (const x of S[k]) {
                        if ((x.img || '').length > 200000) {
                            x.img = await shrink(x.img);
                        }
                    }
                }

                const { error } = await sbClient
                    .from('calc_dados')
                    .upsert({ id: 'farm_data', payload: S }, { onConflict: 'id' });

                if (error) {
                    throw error;
                }

                dirty = false;
                badge('☁ Sincronizado', 'ok');
            } catch (err) {
                const msg = err && err.message ? err.message : 'Falha ao gravar no Supabase';
                badge('⚠ Erro: ' + msg, 'err');
                toast('Erro Supabase ao salvar: ' + msg);
                console.error('Erro Supabase [UPSERT]:', err);
            } finally {
                busy = false;
            }
        }

        async function initSyncReal() {
            badge('☁ Conectando…', 'busy');
            await pullData(false);
        }

        async function checkLogin() {
            if (!sbClient) return;
            try {
                const { data: { session }, error } = await sbClient.auth.getSession();
                if (error) throw error;
                if (session) {
                    $('#login-screen').style.display = 'none';
                    await initSyncReal();
                }
            } catch (err) {
                console.error('Erro ao verificar sessão Supabase:', err);
            }
        }

        // Tratamento de Login (Suporta clique e tecla Enter via submit do form)
        const loginForm = $('#login-form');
        const btnLogin = $('#btn-login');
        const errDiv = $('#login-err');

        if (loginForm) {
            loginForm.onsubmit = async (ev) => {
                ev.preventDefault();
                if (!sbClient) {
                    errDiv.textContent = 'Biblioteca do Supabase bloqueada na rede.';
                    return;
                }
                try {
                    btnLogin.textContent = 'Autenticando...';
                    btnLogin.disabled = true;
                    errDiv.textContent = '';

                    const email = $('#login-email').value.trim();
                    const password = $('#login-pwd').value;

                    if (!email || !password) {
                        errDiv.textContent = 'Preencha o e-mail e a senha.';
                        btnLogin.textContent = 'Entrar no Sistema';
                        btnLogin.disabled = false;
                        return;
                    }

                    const { data, error } = await sbClient.auth.signInWithPassword({
                        email,
                        password
                    });

                    if (error) {
                        errDiv.textContent = 'Erro Supabase: ' + error.message;
                        btnLogin.textContent = 'Entrar no Sistema';
                        btnLogin.disabled = false;
                    } else if (data && data.session) {
                        $('#login-screen').style.display = 'none';
                        btnLogin.textContent = 'Entrar no Sistema';
                        btnLogin.disabled = false;
                        await initSyncReal();
                    }
                } catch (fatal) {
                    errDiv.textContent = 'Falha de conexão com o Supabase: ' + fatal.message;
                    btnLogin.textContent = 'Entrar no Sistema';
                    btnLogin.disabled = false;
                }
            };
        }

        // Botão de Sair (Logout)
        const btnLogout = $('#btn-logout');
        if (btnLogout) {
            btnLogout.onclick = () => {
                ask('Deseja desconectar sua conta deste dispositivo?', async () => {
                    if (sbClient) {
                        await sbClient.auth.signOut();
                    }
                    $('#login-pwd').value = '';
                    $('#login-screen').style.display = 'flex';
                    toast('Sessão encerrada.');
                });
            };
        }

        // Sincronização automática ao alternar entre celular e PC / focar na aba
        document.addEventListener('visibilitychange', () => {
            const loginHidden = $('#login-screen').style.display === 'none';
            if (!document.hidden && loginHidden && !busy && !dirty) {
                pullData(false);
            }
        });

        // Inicialização da Interface (mantendo a aba salva no F5)
        theme();
        render();
        checkLogin();
    </script>
</body>

</html>
