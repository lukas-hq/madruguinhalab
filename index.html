<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Calc3D · Precificação e Estoque</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #04071a;
            --sf: #0b1226;
            --s2: #121b33;
            --bd: #1f2b47;
            --tx: #e6ecf8;
            --mu: #7d8db0;
            --ac: #22b8e0;
            --gr: #3dbb83;
            --pu: #c13fe6;
            --ye: #f5b82e;
            --bad: #f0524f;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        :root[data-theme="light"] {
            --bg: #eef2f8;
            --sf: #fff;
            --s2: #e9eff8;
            --bd: #cdd8e8;
            --tx: #0b1226;
            --mu: #5a6a88;
            --ac: #0b86ad;
            --gr: #0d8a56;
            --pu: #9a22b8;
            --ye: #a87306;
            --bad: #c42b28
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background-color: var(--bg);
            background-image: linear-gradient(rgba(125, 141, 176, .08) 1px, transparent 1px), linear-gradient(90deg, rgba(125, 141, 176, .08) 1px, transparent 1px);
            background-size: 36px 36px;
            color: var(--tx);
            font: 15px/1.45 Outfit, "Segoe UI", system-ui, sans-serif
        }

        header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 5;
            background: var(--sf);
            border-bottom: 1px solid var(--bd);
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 10px 16px;
            overflow-x: auto
        }

        .lg {
            display: flex;
            flex-direction: column;
            margin-right: 14px;
            padding-right: 14px;
            border-right: 1px solid var(--bd);
            white-space: nowrap
        }

        .lg b {
            font: 700 22px Rajdhani, sans-serif;
            line-height: 1
        }

        .lg small {
            color: var(--ac);
            font-size: 10px;
            letter-spacing: .2em;
            font-weight: 700
        }

        .tab {
            background: none;
            border: 1px solid transparent;
            color: var(--mu);
            font: 700 12px Outfit, sans-serif;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap
        }

        .tab.on {
            background: color-mix(in srgb, var(--ac) 16%, transparent);
            border-color: color-mix(in srgb, var(--ac) 40%, transparent);
            color: var(--ac)
        }

        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 26px 16px 70px
        }

        h2 {
            margin: 0;
            font: 700 30px Rajdhani, sans-serif;
            letter-spacing: .02em;
            text-transform: uppercase
        }

        .sp0 {
            flex: 1
        }

        .v {
            display: none
        }

        .v.on {
            display: block
        }

        .mono,
        .line b,
        .cmp td,
        .rn,
        .chip b,
        .st b {
            font-family: "JetBrains Mono", monospace
        }

        h3 {
            margin: 18px 0 8px;
            font-size: 12px;
            color: var(--mu);
            letter-spacing: .1em;
            text-transform: uppercase
        }

        .two {
            display: grid;
            gap: 18px;
            grid-template-columns: 1fr 1.45fr;
            align-items: start
        }

        @media(max-width:860px) {

            .two,
            .top {
                grid-template-columns: 1fr !important
            }
        }

        .card {
            background: var(--sf);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 16px
        }

        .np {
            padding: 0;
            overflow: hidden
        }

        label {
            display: block;
            font-size: 11px;
            color: var(--mu);
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase
        }

        input,
        select {
            width: 100%;
            margin-top: 5px;
            background: var(--bg);
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 11px 12px;
            font: 600 15px Outfit, sans-serif
        }

        input[type=checkbox] {
            width: auto;
            margin-right: 7px
        }

        input[type=range] {
            padding: 0;
            accent-color: var(--ac)
        }

        input:focus,
        select:focus,
        button:focus-visible {
            outline: 2px solid var(--ac);
            outline-offset: 1px
        }

        button {
            font: 700 12px Outfit, sans-serif;
            letter-spacing: .06em;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 9px;
            border: 1px solid var(--bd);
            background: var(--s2);
            color: var(--tx);
            padding: 10px 14px
        }

        button.pri {
            background: var(--ac);
            border-color: var(--ac);
            color: #04121a
        }

        button.gb {
            background: var(--gr);
            border-color: var(--gr);
            color: #03140c
        }

        button.dg {
            color: var(--bad);
            border-color: color-mix(in srgb, var(--bad) 40%, transparent)
        }

        .row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center
        }

        .row.r {
            justify-content: flex-end
        }

        .f2 {
            display: grid;
            gap: 12px;
            grid-template-columns: 1fr 1fr
        }

        .box {
            border: 1px solid var(--bd);
            border-radius: 12px;
            padding: 12px;
            margin-top: 12px
        }

        .mu {
            color: var(--mu)
        }

        .sm {
            font-size: 13px
        }

        .gr {
            color: var(--gr)
        }

        .line {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 4px 0;
            font-size: 14px
        }

        .top {
            display: grid;
            grid-template-columns: 1fr 1fr
        }

        .half {
            padding: 22px 20px;
            text-align: center
        }

        .half+.half {
            border-left: 1px solid var(--bd);
            background: color-mix(in srgb, var(--pu) 7%, transparent)
        }

        .lbl {
            font-size: 11px;
            letter-spacing: .18em;
            font-weight: 700;
            color: var(--ac)
        }

        .pu .lbl {
            color: var(--pu)
        }

        .big {
            font: 700 40px Outfit, sans-serif;
            letter-spacing: -.02em;
            margin: 8px 0 14px
        }

        .chip {
            display: flex;
            justify-content: space-between;
            border: 1px solid var(--bd);
            border-radius: 10px;
            padding: 9px 12px;
            margin-top: 8px;
            font-size: 12px;
            letter-spacing: .1em;
            font-weight: 700;
            color: var(--mu)
        }

        .chip.g {
            border-color: color-mix(in srgb, var(--gr) 45%, transparent);
            color: var(--gr);
            background: color-mix(in srgb, var(--gr) 8%, transparent)
        }

        .chip b {
            color: var(--tx);
            font-size: 14px;
            letter-spacing: 0
        }

        .chip.g b {
            color: var(--gr)
        }

        .cmp {
            width: 100%;
            border-collapse: collapse;
            border-top: 1px solid var(--bd)
        }

        .cmp th {
            font-size: 10px;
            letter-spacing: .14em;
            color: var(--mu);
            padding: 12px 20px
        }

        .cmp th+th,
        .cmp td+td {
            text-align: right
        }

        .cmp td {
            padding: 12px 20px;
            border-top: 1px solid var(--bd);
            font-size: 14px
        }

        .cmp td:first-child {
            font-family: Outfit;
            font-weight: 600
        }

        .cmp i,
        .dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 10px
        }

        .dot {
            margin-right: 8px
        }

        .cmp .fin td {
            background: var(--bg);
            font-weight: 700;
            font-family: Outfit
        }

        .cmp .fin td+td {
            font-family: "JetBrains Mono"
        }

        .roi {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-top: 1px solid var(--bd);
            border-left: 3px solid var(--ye);
            background: color-mix(in srgb, var(--ye) 6%, transparent);
            font-size: 12px;
            letter-spacing: .06em
        }

        .rn {
            font-size: 26px;
            font-weight: 700
        }

        .rn small {
            font-size: 11px;
            color: var(--mu)
        }

        .act {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            border-top: 1px solid var(--bd)
        }

        .act button {
            border: 0;
            border-radius: 0;
            background: none;
            padding: 15px 6px;
            border-left: 1px solid var(--bd)
        }

        .act button:first-child {
            border-left: 0
        }

        .act .pri {
            background: var(--ac)
        }

        .stk {
            display: flex;
            height: 12px;
            border-radius: 7px;
            overflow: hidden;
            margin: 10px 0 12px
        }

        .ttl {
            display: flex;
            align-items: center;
            gap: 14px
        }

        .ic {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 22px;
            border: 1px solid var(--bd);
            background: var(--sf)
        }

        .hd {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--bd);
            margin-bottom: 18px
        }

        .g3 {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            margin-bottom: 18px
        }

        .st {
            padding: 18px
        }

        .st b {
            display: block;
            font-size: 26px
        }

        .st span {
            font-size: 11px;
            letter-spacing: .12em;
            font-weight: 700
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 7px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .08em;
            background: var(--s2);
            border: 1px solid var(--bd)
        }

        .badge.low {
            background: var(--bad);
            color: #fff;
            border-color: var(--bad)
        }

        .badge.pu {
            color: var(--pu);
            border-color: color-mix(in srgb, var(--pu) 45%, transparent)
        }

        .ph {
            height: 200px;
            background: var(--s2);
            display: grid;
            place-items: center;
            color: var(--mu);
            overflow: hidden
        }

        .ph img,
        .pv img,
        .cir img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .cat {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr))
        }

        .cat .card {
            padding: 0;
            overflow: hidden
        }

        .cat .b {
            padding: 14px
        }

        .cir {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 3px solid var(--tx);
            background: var(--s2);
            overflow: hidden;
            flex: none
        }

        .tag {
            background: var(--s2);
            border: 1px solid var(--bd);
            border-radius: 6px;
            padding: 1px 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--mu)
        }

        .bar {
            height: 7px;
            border-radius: 5px;
            background: var(--s2);
            overflow: hidden;
            margin: 6px 0 10px
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--gr)
        }

        .bar.low i {
            background: var(--bad)
        }

        .sub2 {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            align-items: center
        }

        dialog {
            background: var(--sf);
            color: var(--tx);
            border: 1px solid var(--bd);
            border-radius: 14px;
            width: min(480px, 94vw);
            padding: 18px;
            max-height: 92vh
        }

        dialog::backdrop {
            background: #000a
        }

        dialog label {
            margin-bottom: 10px
        }

        .pv {
            height: 150px;
            background: var(--s2);
            border-radius: 10px;
            display: grid;
            place-items: center;
            overflow: hidden;
            margin: 5px 0 6px;
            color: var(--mu)
        }

        table {
            width: 100%;
            border-collapse: collapse
        }

        .empty {
            padding: 36px;
            text-align: center;
            color: var(--mu);
            border: 1px dashed var(--bd);
            border-radius: 14px
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            background: var(--gr);
            color: #03140c;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
            z-index: 20
        }

        #toast.on {
            opacity: 1
        }

        @media print {

            header,
            main,
            #toast {
                display: none
            }

            dialog {
                border: 0;
                box-shadow: none
            }
        }
    </style>
</head>

<body>
    <div id="login-screen" style="position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;">
  <div class="card" style="width:100%;max-width:360px;padding:24px;">
    <h2 style="margin-bottom:16px;text-align:center;">Acesso Restrito</h2>
    <label>E-mail<input type="email" id="login-email"></label>
    <label style="margin-top:12px;">Senha<input type="password" id="login-pwd"></label>
    <button class="pri" id="btn-login" style="width:100%;margin-top:20px;padding:14px;">Entrar</button>
    <div id="login-err" style="color:var(--bad);margin-top:12px;font-size:12px;text-align:center;"></div>
  </div>
</div>
    <header>
        <div class="lg"><b>Calc3D</b><small>SLICER EDITION</small></div>
        <button class="tab on" data-t="calc">Calc</button><button class="tab" data-t="hist">Histórico</button><button
            class="tab" data-t="est">Estoque</button><button class="tab" data-t="set">Ajustes</button>
        <span class="sp0"></span><span id="sy" data-a="sync" class="mu sm" style="white-space:nowrap;cursor:pointer"
            title="Clique para atualizar da nuvem"></span><button id="th" title="Alternar tema">◐</button><select
            id="cs" data-s="cur" style="width:auto;margin:0;padding:8px 10px">
            <option>BRL</option>
            <option>USD</option>
            <option>EUR</option>
        </select>
    </header>
    <main>
        <section class="v on" id="v-calc"></section>
        <section class="v" id="v-hist"></section>
        <section class="v" id="v-est"></section>
        <section class="v" id="v-set"></section>
    </main>
    <dialog id="dlg"></dialog>
    <dialog id="cf"></dialog>
    <div id="toast"></div>
    <script>
        const $ = s => document.querySelector(s), uid = () => Math.random().toString(36).slice(2, 9);
        const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        const D0 = { set: { kwh: .9, kg: 120, minP: 10, labor: 25, cur: 'BRL', usd: 5.5, eur: 6, theme: '' }, machines: [], spools: [], items: [], hist: [] };
        let S; try { S = Object.assign({}, D0, JSON.parse(localStorage.getItem('z3c') || '{}')) } catch (e) { S = JSON.parse(JSON.stringify(D0)) }
        S.set = Object.assign({}, D0.set, S.set);
        const save = () => { let ok = true; try { localStorage.setItem('z3c', JSON.stringify(S)) } catch (e) { ok = !!COL; if (!ok) toast('Sem espaço no navegador. Exporte um backup ou use imagens menores.') } push(); return ok };
        const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.k); toast.k = setTimeout(() => t.classList.remove('on'), 2400) };
        const theme = () => { document.documentElement.dataset.theme = S.set.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'); $('#cs').value = S.set.cur };
        let COL = null, snap = {}, ptm = 0, busy = false, dirty = false;
        const KS = ['machines', 'spools', 'items', 'hist'];
        const nrec = o => Object.keys(o).filter(k => k != 'settings').length, lrec = () => KS.reduce((a, k) => a + S[k].length, 0);
        const badge = t => { const b = $('#sy'); if (b) b.textContent = t };
        const ask = (m, cb) => { const d = $('#cf'); d.innerHTML = `<p style="margin:0 0 16px;font-size:16px">${esc(m)}</p><div class="row r"><button id="cn">Cancelar</button><button class="dg" id="ok2">Confirmar</button></div>`; $('#cn').onclick = () => d.close(); $('#ok2').onclick = () => { d.close(); cb() }; d.showModal() };
        const shrink = u => new Promise(r => { const i = new Image(); i.onload = () => { const k = Math.min(1, 720 / Math.max(i.width, i.height)), c = document.createElement('canvas'); c.width = i.width * k; c.height = i.height * k; c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); let q = .68, o = c.toDataURL('image/jpeg', q); while (o.length > 170000 && q > .3) { q -= .1; o = c.toDataURL('image/jpeg', q) } r(o) }; i.onerror = () => r(u); i.src = u });
        function flat() { const o = { settings: Object.assign({ k: 'settings' }, S.set) }; KS.forEach(k => S[k].forEach((r, i) => { if (!r.ts) r.ts = Date.now() + i; o[k + '_' + r.id] = Object.assign({ k }, r) })); return o }
        function push() { if (!COL) return; dirty = true; clearTimeout(ptm); ptm = setTimeout(run, 500) }
        function adopt(o) {
            const n = { set: Object.assign({}, D0.set, o.settings || {}), machines: [], spools: [], items: [], hist: [] }; delete n.set.k;
            for (const id in o) { const r = Object.assign({}, o[id]), k = r.k; if (KS.includes(k)) { delete r.k; n[k].push(r) } }
            KS.forEach(k => n[k].sort((a, b) => (a.ts || 0) - (b.ts || 0))); S = n; snap = {}; const f = flat(); for (const k in f) snap[k] = JSON.stringify(f[k]); theme()
        }
        const rate = () => ({ BRL: 1, USD: 1 / S.set.usd, EUR: 1 / S.set.eur }[S.set.cur] || 1);
        const R = v => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: S.set.cur }).format((v || 0) * rate());
        const N = (v, d = 0) => (+v || 0).toLocaleString('pt-BR', { maximumFractionDigits: d });
        let tab = 'calc', sub = 'sp';
        const C0 = () => ({ name: '', qty: 1, w: 0, t: 0, mid: '', sid: '', kg: null, multi: false, w2: 0, kg2: 0, fin: 0, oth: 0, pack: 0, fail: 0, img: '', editId: null, prof: 50, round: false, ded: true });
        let C = C0();
        function calc() {
            const m = S.machines.find(x => x.id == C.mid) || { watts: 0, price: 0, life: 1, maint: 0 }, sp = S.spools.find(x => x.id == C.sid);
            const kg = sp ? sp.price / Math.max(sp.init, 1) * 1000 : (C.kg ?? S.set.kg), t = C.t;
            const mat = C.w / 1000 * kg + (C.multi ? C.w2 / 1000 * C.kg2 : 0), en = m.watts / 1000 * t * S.set.kwh, dep = m.price / Math.max(m.life, 1) * t, mn = m.maint * t, lab = C.fin * S.set.labor;
            const q = Math.max(C.qty, 1), f = C.fail || 0, prod = mat + en + dep + mn, fx = lab + C.oth + C.pack, u = prod + fx, lossC = prod * f / q, cost = prod + lossC + fx;
            let profit = Math.max(cost * C.prof / 100, S.set.minP), tot = cost + profit;
            if (C.round) { tot = Math.ceil(tot * rate()) / rate(); profit = tot - cost }
            return { mat, en, dep, mn, lab, u, loss: lossC, cost, cu: cost / q, profit, tot, unit: tot / q, roi: m.price > 0 && profit > 0 ? Math.ceil(m.price / (profit / q)) : 0, m, sp }
        }
        const fld = (k, l, s = 'any', ex = '') => `<label>${l}<input type="number" step="${s}" data-k="${k}" value="${C[k] ?? ''}" ${ex}></label>`;
        function renderCalc() {
            const mo = `<option value="">Sem perfil</option>` + S.machines.map(m => `<option value="${m.id}" ${m.id == C.mid ? 'selected' : ''}>${esc(m.name)}</option>`).join('');
            const so = `<option value="">Manual (custo do kg)</option>` + S.spools.map(s => `<option value="${s.id}" ${s.id == C.sid ? 'selected' : ''}>${esc(s.brand)} ${s.mat} ${esc(s.color)} · ${N(s.cur)}g</option>`).join('');
            $('#v-calc').innerHTML = `<div class="two"><div class="card"><div class="row" style="justify-content:space-between;margin-bottom:14px"><b style="letter-spacing:.1em;font-size:13px">${C.editId ? 'EDITANDO PROJETO SALVO' : 'PARÂMETROS'}</b><button class="dg" data-a="reset" title="Limpar">Limpar</button></div>
<div class="f2" style="grid-template-columns:2fr 1fr"><label>Nome do projeto<input data-k="name" value="${esc(C.name)}"></label>${fld('qty', 'Qtd', '1')}</div>
<label style="margin-top:12px">Foto do projeto<div class="pv" id="cpv">${C.img ? `<img src="${C.img}" alt="">` : 'Sem imagem'}</div><input type="file" accept="image/*" id="cfi"></label>
<div class="box"><div class="f2">${fld('w', 'Peso total do projeto (g)')}${fld('t', 'Tempo total (h)')}</div></div>

                    if (save()) { toast(it ? 'Peça atualizada no catálogo.' : 'Enviado ao catálogo de peças.'); if ($('#dlg').open) $('#dlg').close(); renderHist() }
                },
                viewh: () => {

                    $('#cl').onclick = () => d.close(); $('#tc').onclick = () => A.tocat(); const e2 = $('#ed2'); if (e2) e2.onclick = () => { d.close(); A.edh() }; d.showModal()
                },
                newsp: () => form('Novo carretel', SF, { mat: 'PLA' }, o => { S.spools.push(Object.assign({ id: uid() }, o)); save(); renderEst() }),
                edsp: () => form('Editar carretel', SF, by('spools', id), o => { Object.assign(by('spools', id), o); save(); renderEst() }),
                delsp: () => ask('Excluir este carretel?', () => { S.spools = S.spools.filter(x => x.id != id); save(); renderEst() }),
                newit: () => form('Nova peça', IF(), { qty: 0 }, o => { S.items.push(Object.assign({ id: uid() }, o)); save(); renderEst() }),
                edit: () => form('Editar peça', IF(), by('items', id), o => { Object.assign(by('items', id), o); save(); renderEst() }),
                delit: () => ask('Excluir esta peça do catálogo?', () => { S.items = S.items.filter(x => x.id != id); save(); renderEst() }),
                qm: () => { const i = by('items', id); i.qty = Math.max(0, i.qty - 1); save(); renderEst() }, qp: () => { by('items', id).qty++; save(); renderEst() },
                useit: () => { const i = by('items', id); C = Object.assign(C0(), { name: i.name, w: i.w, t: i.t, mid: i.mid, sid: i.sid, img: i.img || '' }); go('calc') },
                newmc: () => form('Nova impressora', MF, {}, o => { S.machines.push(Object.assign({ id: uid() }, o)); save(); renderSet() }),
                edmc: () => form('Editar impressora', MF, by('machines', id), o => { Object.assign(by('machines', id), o); save(); renderSet() }),
                dupmc: () => { const m = by('machines', id); S.machines.push(Object.assign({}, m, { id: uid(), name: m.name + ' (cópia)' })); save(); renderSet() },

        try {
            const supabase = window.supabase.createClient(
              'https://ucjemvzcbnbcqoshqnpr.supabase.co', 
              'sb_publishable_0pvUyBZ4r6PIZXtoOirl7A_MR7Ofe6W' 
            );

            // DESTRAVA O SALVAMENTO
            COL = true; 

            async function pullData() {
              const { data, error } = await supabase.from('calc_dados').select('payload').eq('id', 'farm_data').single();
              if (data && data.payload) {
                 S = Object.assign({}, D0, data.payload);
                 S.set = Object.assign({}, D0.set, S.set);
                 render();
                 theme();
              }
            }

            async function run() {
              if (busy) { ptm = setTimeout(run, 500); return; }
              busy = true;
              badge('☁ Salvando…');
              try {
                for(const k of ['spools','items','hist'])
                  for(const x of S[k])
                    if((x.img||'').length > 200000) x.img = await shrink(x.img);
                    
                const { error } = await supabase.from('calc_dados').upsert({ id: 'farm_data', payload: S });
                if (error) throw error;
                dirty = false;
                badge('☁ Sincronizado');
              } catch(e) {
                badge('⚠ Erro ao sincronizar');
                console.error("Erro no Run:", e);
              }
              busy = false;
            }

            async function initSyncReal() {
              badge('Conectando ao banco…');
              await pullData();
              badge('☁ Sincronizado');
            }

            async function checkLogin() {
              try {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                  document.getElementById('login-screen').style.display = 'none';
                  initSyncReal();
                }
              } catch(err) {
                 console.error("Erro de sessão:", err);
              }
            }

            // Ação do Botão Blindada
            const btnLogin = document.getElementById('btn-login');
            const errDiv = document.getElementById('login-err');
            
            btnLogin.onclick = async () => {
              try {
                btnLogin.textContent = 'Carregando...';
                errDiv.textContent = '';
                
                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-pwd').value;
                
                if (!email || !password) {
                  errDiv.textContent = 'Preencha os dois campos.';
                  btnLogin.textContent = 'Entrar';
                  return;
                }

                const { data, error } = await supabase.auth.signInWithPassword({ email, password });

                if (error) {
                  errDiv.textContent = 'Erro Supabase: ' + error.message;
                  btnLogin.textContent = 'Entrar';
                } else {
                  document.getElementById('login-screen').style.display = 'none';
                  initSyncReal();
                }
              } catch (fatal) {
                errDiv.textContent = 'Erro Fatal JS: ' + fatal.message;
                btnLogin.textContent = 'Entrar';
              }
            };

            // === PATCH DE SINCRONIZAÇÃO INTELIGENTE ===
            document.addEventListener('visibilitychange', () => {
              if (!document.hidden && document.getElementById('login-screen').style.display === 'none') {
                pullData();
              }
            });

            document.getElementById('sy').addEventListener('click', async (e) => {
              e.stopPropagation();
              badge('Baixando dados...');
              await pullData();
              badge('☁ Sincronizado');
            }, true);

            checkLogin();
        } catch (geral) {
            alert("Erro catastrófico ao carregar biblioteca: " + geral.message);
        }

        // Renderiza a interface por baixo da tela preta
        theme(); 
        render();
    </script>
